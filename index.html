<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Planos de Aula</title>
</head>

<body>

    <header>
        <h1>Meus Planos de Aula</h1>
        <nav>
            <button onclick="mostrarListagem()">Ver Planos</button>
            <button onclick="mostrarFormulario()">Novo Plano</button>
        </nav>
    </header>

    <main>
        <section id="tela-listagem">
            <h2>Lista de Planos</h2>

            <div
                style="background: #f8f9fa; padding: 15px; margin-bottom: 20px; border-radius: 8px; font-family: sans-serif;">
                <h3 style="margin-top: 0;">Filtros e Ordenação</h3>

                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                    <input type="text" id="filtro-titulo" placeholder="Buscar por Título..."
                        style="padding: 6px; flex: 1; min-width: 200px;">

                    <select id="filtro-disciplina" style="padding: 6px; flex: 1; min-width: 150px;">
                        <option value="">Todas as Disciplinas</option>
                    </select>

                    <select id="filtro-tag" style="padding: 6px; flex: 1; min-width: 120px;">
                        <option value="">Todas as Tags</option>
                    </select>

                    <div style="display: flex; align-items: center; gap: 5px;">
                        <label for="filtro-data-inicio" style="font-size: 14px;">De:</label>
                        <input type="date" id="filtro-data-inicio" style="padding: 6px;">
                    </div>

                    <div style="display: flex; align-items: center; gap: 5px;">
                        <label for="filtro-data-fim" style="font-size: 14px;">Até:</label>
                        <input type="date" id="filtro-data-fim" style="padding: 6px;">
                    </div>
                </div>

                <div
                    style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <label style="margin-right: 5px;"><strong>Ordenar por:</strong></label>
                        <select id="ordenacao-seletor" style="padding: 6px;">
                            <option value="cadastro-desc">Mais recentes (Padrão)</option>
                            <option value="cadastro-asc">Mais antigos</option>
                            <option value="titulo-asc">Título (A-Z)</option>
                            <option value="titulo-desc">Título (Z-A)</option>
                        </select>
                    </div>

                    <button id="btn-limpar-filtros"
                        style="padding: 6px 12px; background: #6c757d; color: white; border: none; border-radius: 3px; cursor: pointer;">Limpar
                        Filtros</button>
                </div>
            </div>

            <div id="lista-planos">Carregando planos...</div>

            <div id="paginacao" style="margin-top: 20px; text-align: center;"></div>
        </section>

        <section id="tela-formulario" style="display: none;">
            <h2>Cadastrar Novo Plano</h2>
            <form id="form-plano">
                <input type="text" id="titulo" placeholder="Título do Plano" required><br><br>
                <input type="text" id="disciplina" placeholder="Disciplina" required><br><br>
                <input type="date" id="dataPrevista" required><br><br>
                <textarea id="objetivo" placeholder="Objetivo do plano" required></textarea><br><br>
                <textarea id="ementa" placeholder="Ementa da disciplina" required></textarea><br><br>

                <div>
                    <label><strong>Conteúdos (obrigatório pelo menos um):</strong></label>
                    <div id="container-conteudos"></div>
                    <button type="button" onclick="adicionarInput('container-conteudos')">+ Conteúdo</button>
                </div><br>

                <div>
                    <label><strong>Recursos de Apoio (obrigatório pelo menos um):</strong></label>
                    <div id="container-recursos"></div>
                    <button type="button" onclick="adicionarInput('container-recursos')">+ Recurso</button>
                </div><br>

                <div>
                    <label><strong>Tags (obrigatório pelo menos um):</strong></label>
                    <div id="container-tags"></div>
                    <button type="button" onclick="adicionarInput('container-tags')">+ Tag</button>
                </div><br>

                <button type="submit">Salvar Novo Plano</button>
            </form>
        </section>

        <section id="tela-editar" style="display: none;">
            <h2>Editar Plano de Aula</h2>
            <form id="form-editar-plano">
                <input type="hidden" id="edit-id">

                <input type="text" id="edit-titulo" placeholder="Título do Plano" required><br><br>
                <input type="text" id="edit-disciplina" placeholder="Disciplina" required><br><br>
                <input type="date" id="edit-dataPrevista" required><br><br>
                <textarea id="edit-objetivo" placeholder="Objetivo do plano" required></textarea><br><br>
                <textarea id="edit-ementa" placeholder="Ementa da disciplina" required></textarea><br><br>

                <div>
                    <label><strong>Conteúdos (obrigatório pelo menos um):</strong></label>
                    <div id="edit-container-conteudos"></div>
                    <button type="button" onclick="adicionarInput('edit-container-conteudos')">+ Conteúdo</button>
                </div><br>

                <div>
                    <label><strong>Recursos de Apoio (obrigatório pelo menos um):</strong></label>
                    <div id="edit-container-recursos"></div>
                    <button type="button" onclick="adicionarInput('edit-container-recursos')">+ Recurso</button>
                </div><br>

                <div>
                    <label><strong>Tags (obrigatório pelo menos um):</strong></label>
                    <div id="edit-container-tags"></div>
                    <button type="button" onclick="adicionarInput('edit-container-tags')">+ Tag</button>
                </div><br>

                <button type="submit">Salvar Alterações</button>
                <button type="button" onclick="mostrarListagem()">Cancelar</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
